# Adds chromium via Nix (not apt) for lib/crawl/browser.ts's headless-render
# fallback. This started as `aptPkgs = ["chromium"]`, but that resolved to
# Ubuntu's snap-only transitional "chromium-browser" package on this VPS's
# Nixpacks base image — no real binary, and its postinst hung the build
# entirely (confirmed in production deploy logs, 2026-08-16). Nix's chromium
# is a self-contained package with no snapd dependency, so it sidesteps the
# problem outright.
#
# nixPkgs here is explicit rather than left to auto-detection, so it also
# has to carry the Node package Nixpacks would otherwise auto-select —
# nodejs_22 is what's actually running successfully in production right now
# (confirmed via deploy logs), not nodejs_24 as the "engines" field in
# package.json might suggest; npm doesn't hard-enforce engines without
# --engine-strict. If package.json's required Node version ever changes,
# update the nodejs_NN entry below to match — it will NOT re-auto-detect.
[phases.setup]
nixPkgs = ["nodejs_22", "chromium"]
